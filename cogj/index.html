<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="cogj.dk — siden er under opbygning.">
<meta name="robots" content="noindex">
<title>cogj.dk — Under opbygning</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Cpath d='M20.5 11.5a6 6 0 1 0 0 9' fill='none' stroke='%23e8b64c' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: #0d1117;
        color: #e6e8eb;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        overflow: hidden;
    }

    /* Diskret baggrundsglød */
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse 70% 55% at 50% 38%, rgba(232,182,76,0.07) 0%, transparent 70%);
        pointer-events: none;
    }

    main { position: relative; padding: 24px; }

    .wordmark {
        font-size: clamp(2.6em, 9vw, 4.5em);
        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 1.1;
        color: #fff;
    }

    .wordmark span { color: #e8b64c; }

    .divider {
        width: 64px;
        height: 3px;
        border-radius: 2px;
        background: #e8b64c;
        margin: 26px auto;
    }

    .status {
        font-size: clamp(1em, 3vw, 1.25em);
        color: #9aa4b2;
        letter-spacing: 0.14em;
        text-transform: uppercase;
    }

    .status .dots::after {
        content: '';
        animation: dots 2.4s steps(4, end) infinite;
    }

    @keyframes dots {
        0%   { content: ''; }
        25%  { content: '.'; }
        50%  { content: '..'; }
        75%  { content: '...'; }
        100% { content: ''; }
    }
</style>
</head>
<body>
<main>
    <h1 class="wordmark">cogj<span>.dk</span></h1>
    <div class="divider"></div>
    <p class="status">Under opbygning<span class="dots"></span></p>
</main>
</body>
</html>
