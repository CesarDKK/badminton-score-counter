# Opstrøms-containere slås op løbende (resolver + variabel), ikke kun når nginx starter: genstartes en backend og får
# en ny adresse i docker-netværket, fulgte nginx før den gamle adresse og svarede 502, til nginx selv blev genstartet
# (set 2026-09-22 med football-backend). Dockers DNS svarer på 127.0.0.11.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 5M;

    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $football_backend http://football-backend:3001;
        proxy_pass $football_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.js$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.css$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
