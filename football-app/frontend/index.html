<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e14" />
  <title>Football Tournament</title>
  <link rel="stylesheet" href="/fundament.css?v=2" />
  <link rel="stylesheet" href="/styles.css?v=5" />
</head>
<body>
  <div class="shell">
    <header class="app-header">
      <div class="app-header-inner">
        <a href="/" class="brand-mark" style="text-decoration: none; color: inherit;">
          <div class="brand-glyph">
            <!-- footballapp-mærket: samme bold som salgssiden og faviconet -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/>
              <path fill="currentColor" stroke="none" d="M12 8.5L15.33 10.92L14.06 14.83L9.94 14.83L8.67 10.92zM15.07 3.54L15.23 4.05L12 6.4L8.77 4.05L8.93 3.54A9 9 0 0 1 15.07 3.54zM20.99 12.3L20.56 12.62L17.33 10.27L18.56 6.47L19.1 6.47A9 9 0 0 1 20.99 12.3zM14.49 20.65L14.06 20.33L15.29 16.53L19.29 16.53L19.45 17.04A9 9 0 0 1 14.49 20.65zM4.55 17.04L4.71 16.53L8.71 16.53L9.94 20.33L9.51 20.65A9 9 0 0 1 4.55 17.04zM4.9 6.47L5.44 6.47L6.67 10.27L3.44 12.62L3.01 12.3A9 9 0 0 1 4.9 6.47z"/>
              <path stroke-width="1.2" stroke-linecap="round" d="M12 8.5L12 6.4M15.33 10.92L17.33 10.27M14.06 14.83L15.29 16.53M9.94 14.83L8.71 16.53M8.67 10.92L6.67 10.27M15.23 4.05L18.56 6.47M20.56 12.62L19.29 16.53M14.06 20.33L9.94 20.33M4.71 16.53L3.44 12.62M5.44 6.47L8.77 4.05"/>
            </svg>
          </div>
          <div class="brand-title" id="brandTitle">Football</div>
        </a>
        <div class="app-header-actions">
          <span id="langToggle"></span>
          <button class="btn-icon btn-ghost hidden" id="backToListBtn" data-back="list" data-i18n-aria="common.back" aria-label="Tilbage">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
          </button>
          <a href="/login.html" class="btn-ghost btn-sm" data-i18n="common.admin">Admin</a>
        </div>
      </div>
    </header>

    <main class="container">
      <!-- Apex landing — vises kun hvis ingen klub-subdomain -->
      <div id="view-apex" class="hidden">
        <div class="empty fade-in">
          <div class="icon">
            <!-- footballapp-mærket: samme bold som salgssiden og faviconet -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/>
              <path fill="currentColor" stroke="none" d="M12 8.5L15.33 10.92L14.06 14.83L9.94 14.83L8.67 10.92zM15.07 3.54L15.23 4.05L12 6.4L8.77 4.05L8.93 3.54A9 9 0 0 1 15.07 3.54zM20.99 12.3L20.56 12.62L17.33 10.27L18.56 6.47L19.1 6.47A9 9 0 0 1 20.99 12.3zM14.49 20.65L14.06 20.33L15.29 16.53L19.29 16.53L19.45 17.04A9 9 0 0 1 14.49 20.65zM4.55 17.04L4.71 16.53L8.71 16.53L9.94 20.33L9.51 20.65A9 9 0 0 1 4.55 17.04zM4.9 6.47L5.44 6.47L6.67 10.27L3.44 12.62L3.01 12.3A9 9 0 0 1 4.9 6.47z"/>
              <path stroke-width="1.2" stroke-linecap="round" d="M12 8.5L12 6.4M15.33 10.92L17.33 10.27M14.06 14.83L15.29 16.53M9.94 14.83L8.71 16.53M8.67 10.92L6.67 10.27M15.23 4.05L18.56 6.47M20.56 12.62L19.29 16.53M14.06 20.33L9.94 20.33M4.71 16.53L3.44 12.62M5.44 6.47L8.77 4.05"/>
            </svg>
          </div>
          <h3>FootballApp</h3>
          <p data-i18n-html="public.apexText">Hver klub har sit eget subdomæne — fx <strong>jeresklub.footballapp.dk</strong>.<br>
            Kontakt din klubadministrator for adgang.</p>
        </div>
      </div>

      <div id="view-list" class="hidden">
        <div class="eyebrow fade-in" id="clubEyebrow" data-i18n="public.liveTournaments" style="margin-bottom: var(--sp-2);">Live-turneringer</div>
        <h2 class="display-lg fade-in" id="clubHeading" data-i18n="public.tournaments" style="margin: 0 0 var(--sp-5);">Turneringer</h2>
        <div id="tournamentList" class="tournament-list"></div>
      </div>

      <div id="view-detail" class="hidden">
        <div id="tournament-hero" class="tournament-hero fade-in"></div>
        <div id="detail-pools" class="fade-in"></div>
        <div id="detail-cups-section" class="hidden">
          <div class="eyebrow" data-i18n="public.cupStage" style="margin: var(--sp-7) 0 var(--sp-3);">Cup-fase</div>
          <div id="detail-cups"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/i18n.js?v=2"></script>
  <script src="/logo-match.js"></script>
  <script src="/public.js"></script>
</body>
</html>
