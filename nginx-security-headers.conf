# Fælles sikkerheds-headere — inkluderes i hver location.
#
# Hvorfor include og ikke ét sæt på server-niveau: i nginx nedarves add_header
# IKKE ind i en location der selv har add_header (fx cache-reglerne). Et snippet
# der includes lokalt sætter derfor headeren pålideligt overalt.
#
# X-Content-Type-Options: browseren må ikke gætte MIME-typen. Sammen med
#   validering af upload-indhold lukker det stored-XSS via en fil der er
#   forklædt som billede men serveres fra /uploads.
# Referrer-Policy: læk ikke fulde URL'er (kan indeholde tokens) til tredjeparter.
#
# BEVIDST udeladt: X-Frame-Options / frame-ancestors — Oversigten skal kunne
#   indlejres i en iframe på klubbernes egne hjemmesider.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
