# Delt log-rotation: uden dette vokser container-loggene ubegrænset på en
# server der kører i månedsvis (default json-file uden grænser).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: badminton-mysql
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?sæt MYSQL_ROOT_PASSWORD i .env}
      MYSQL_DATABASE: badminton_counter
      MYSQL_USER: badminton_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?sæt MYSQL_PASSWORD i .env}
    # Kun tilgængelig fra selve serveren (host-side mysqldump/fejlsøgning).
    # Docker's egne iptables-regler omgår ufw, så "0.0.0.0:3306" ville udstille
    # databasen på den offentlige IP uanset firewall — bind derfor til localhost.
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./backend/init.master.sql:/docker-entrypoint-initdb.d/init.master.sql:ro
      - ./backend/migrations:/docker-entrypoint-initdb.d/migrations:ro
    networks:
      - badminton-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: badminton-backend
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - installation.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: badminton_user
      DB_PASSWORD: ${MYSQL_PASSWORD:?sæt MYSQL_PASSWORD i .env}
      DB_NAME: badminton_counter
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?sæt MYSQL_ROOT_PASSWORD i .env}
      JWT_SECRET: ${JWT_SECRET:?sæt JWT_SECRET i .env (mindst 32 tegn)}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: 10485760
      # Super-admin har brug for adgang til football_tournament-DB for at administrere
      # football-klubber + admins (Phase 2 feature)
      FOOTBALL_DB_USER: football_user
      FOOTBALL_DB_PASSWORD: ${FOOTBALL_DB_PASSWORD:?sæt FOOTBALL_DB_PASSWORD i .env}
    # Kun localhost: nginx-containeren når backenden internt via docker-netværket
    # (backend:3000), så host-porten behøver ikke være åben mod internettet.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - badminton-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: badminton-frontend
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "8080:80"
    depends_on:
      - backend
      - football-frontend
      - stats-backend
    networks:
      - badminton-network

  # Football Tournament — One-shot DB initializer
  # Creates database, tables, and football_user (idempotent — safe to re-run).
  # Exits when done; football-backend depends on its successful completion.
  football-db-init:
    image: mysql:8.0
    container_name: football-db-init
    restart: "no"
    logging: *default-logging
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?sæt MYSQL_ROOT_PASSWORD i .env}
      FOOTBALL_DB_PASSWORD: ${FOOTBALL_DB_PASSWORD:?sæt FOOTBALL_DB_PASSWORD i .env}
    volumes:
      - ./football-app/backend/init.sql:/init/schema.sql:ro
    networks:
      - badminton-network
    entrypoint:
      - bash
      - -c
      - |
        set -e
        echo "[football-db-init] Applying schema..."
        mysql -h mysql -uroot -p"$$MYSQL_ROOT_PASSWORD" < /init/schema.sql
        echo "[football-db-init] Ensuring football_user..."
        mysql -h mysql -uroot -p"$$MYSQL_ROOT_PASSWORD" -e "
          CREATE USER IF NOT EXISTS 'football_user'@'%' IDENTIFIED BY '$$FOOTBALL_DB_PASSWORD';
          ALTER USER 'football_user'@'%' IDENTIFIED BY '$$FOOTBALL_DB_PASSWORD';
          GRANT ALL PRIVILEGES ON football_tournament.* TO 'football_user'@'%';
          FLUSH PRIVILEGES;
        "
        echo "[football-db-init] Done."

  # Football Tournament — Backend
  football-backend:
    build:
      context: ./football-app
      dockerfile: Dockerfile.backend
    container_name: football-backend
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - installation.env
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: football_user
      DB_PASSWORD: ${FOOTBALL_DB_PASSWORD:?sæt FOOTBALL_DB_PASSWORD i .env}
      DB_NAME: football_tournament
      JWT_SECRET: ${FOOTBALL_JWT_SECRET:?sæt FOOTBALL_JWT_SECRET i .env (mindst 32 tegn)}
      UPLOAD_DIR: /app/uploads
    volumes:
      - football_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      football-db-init:
        condition: service_completed_successfully
    networks:
      - badminton-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Football Tournament — Frontend (internal nginx, not exposed)
  football-frontend:
    build:
      context: ./football-app
      dockerfile: Dockerfile.frontend
    container_name: football-frontend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - football-backend
    networks:
      - badminton-network

  # Klubstatistik — statistik.badmintonapp.dk
  # Egen service, adskilt fra pointtællingen, så en langvarig indsamling fra
  # badmintonplayer.dk aldrig kan påvirke en kamp der er i gang.
  stats-backend:
    build:
      context: .
      dockerfile: Dockerfile.stats
    container_name: badminton-stats
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      PORT: 3002
      CACHE_DIR: /data/cache
      CACHE_TTL_HOURS: 24
      # Pause mellem hvert kald mod badmintonplayer.dk
      BP_MIN_DELAY_MS: 700
      BP_JITTER_MS: 400
    volumes:
      - stats_cache:/data
    networks:
      - badminton-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3002/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Automatisk backup af ALLE databaser + uploadede billeder.
  # Tager en dump hver ${BACKUP_INTERVAL_HOURS}. time og beholder dem i
  # ${BACKUP_RETENTION_DAYS} dage. Backup'erne ligger i det navngivne volume
  # "backups" (host-sti fås med: docker volume inspect badminton-app_backups).
  backup:
    image: mysql:8.0
    container_name: badminton-backup
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?sæt MYSQL_ROOT_PASSWORD i .env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - backups:/backups
      - uploads_data:/data/uploads:ro
      - football_uploads:/data/football_uploads:ro
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
    networks:
      - badminton-network
    entrypoint: ["bash", "/backup-loop.sh"]

networks:
  badminton-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local
  football_uploads:
    driver: local
  stats_cache:
    driver: local
  backups:
    driver: local
