# Opstrøms-containere slås op løbende (resolver + variabel), ikke kun når nginx starter: genstartes en backend og får
# en ny adresse i docker-netværket, fulgte nginx før den gamle adresse og svarede 502, til nginx selv blev genstartet
# (set 2026-09-22 med football-backend). Dockers DNS svarer på 127.0.0.11.

# Skjul nginx-version i Server-headeren og fejlsider
server_tokens off;

# nginx' egne omdirigeringer (return 302 /sti, mappe uden /) sendes relativt. Bag Cloudflare taler nginx
# http, så absolutte omdirigeringer blev til http://… og tog en omvej over Cloudflares https-omdirigering.
absolute_redirect off;

# Planner-løseren er CPU-tung: højst 6 kald i minuttet pr. KLIENT.
# Bag Cloudflare er $remote_addr Cloudflares adresse, som mange brugere deler — så grænsen ramte alle på én gang.
# Klienten kendes på CF-Connecting-IP (som backend/middleware/rateLimiter.js også bruger); uden Cloudflare
# (lokal test) bruges forbindelsens adresse. Headeren kan forfalskes af den, der går UDEN OM Cloudflare, så der
# er også et loft pr. forbindelses-adresse — højt nok til, at flere brugere bag samme Cloudflare-adresse ikke mærker det.
map $http_cf_connecting_ip $planner_klient {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
limit_req_zone $planner_klient zone=planner_solve:1m rate=6r/m;
limit_req_zone $planner_klient zone=planner_status:1m rate=60r/m;
limit_req_zone $binary_remote_addr zone=planner_solve_ip:1m rate=30r/m;
limit_req_zone $binary_remote_addr zone=planner_status_ip:1m rate=600r/m;

# Football-login: 10 forsøg i træk, derefter 2 i minuttet pr. klient (samme klient-nøgle som planneren).
# Grænsen sidder her, fordi football-backend kun ser football-frontends adresse, ikke klientens.
limit_req_zone $planner_klient zone=football_login:1m rate=2r/m;

# Løseren må kun startes fra planneren selv: et fremmed websted må ikke kunne lade sine besøgendes browsere
# optage den. Kald uden Origin (curl, overvågning) er ikke browsere og slipper igennem til rate-grænserne.
map $http_origin $planner_fremmed_origin {
    default                              1;
    ""                                   0;
    "https://planner.badmintonapp.dk"    0;
    "http://planner.localhost"           0;
}

# ── Marketing site — badmintonapp.dk ───────────────────────
server {
    listen 80;
    server_name www.badmintonapp.dk;
    return 301 https://badmintonapp.dk$request_uri;
}

server {
    listen 80;
    server_name badmintonapp.dk;
    root /usr/share/nginx/marketing;
    index index.html;

    # Kun https://badmintonapp.dk/ svarer med siden (Google: "alternative
    # sider"). $request_uri så index-direktivets interne / → /index.html
    # ikke giver en løkke.
    if ($request_uri ~ ^/index\.html(\?.*)?$) {
        return 301 https://badmintonapp.dk/;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ =404;
    }

    location ~* \.html$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.css$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.js$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}

# ── Klubstatistik — statistik.badmintonapp.dk ──────────────
# Selvstændigt site med egen backend (stats-backend). Skal stå før default_server,
# så subdomænet ikke ryger ned i klub-fallbacken sammen med lyngby.badmintonapp.dk.
server {
    listen 80;
    # statistik.localhost gør det muligt at teste sitet lokalt — Chrome slår
    # alle *.localhost op som 127.0.0.1 uden hosts-fil.
    server_name statistik.badmintonapp.dk statistik.localhost;
    root /usr/share/nginx/statistik;
    index index.html;

    # Statistik-svarene er JSON med mange gentagne nøgler — de komprimerer til
    # omkring en tiendedel.
    gzip on;
    gzip_types application/json text/css application/javascript text/csv;
    gzip_min_length 1024;
    gzip_proxied any;

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.html$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Indsamlingen kan tage minutter, men hvert enkelt kald svarer med det samme
    # (klienten poller på /api/jobs), så et normalt timeout er rigeligt.
    location ^~ /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $stats_backend http://stats-backend:3002;
        proxy_pass $stats_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.css$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.js$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}

# ── Planner — planner.badmintonapp.dk ─────────────────────
# Tidsplanlægger til individuelle turneringer (kode i planner/, design i
# docs/planner-design.md). Rent statisk: TP-filen læses i browseren, ingen backend.
server {
    listen 80;
    # planner.localhost til lokal test — Chrome slår *.localhost op som 127.0.0.1.
    server_name planner.badmintonapp.dk planner.localhost;
    root /usr/share/nginx/planner;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    # CP-SAT-løseren (planner-solver). Variabel + Dockers DNS, så nginx kan starte,
    # selvom løseren er nede — så svarer /api/solve blot 502, og planneren bruger
    # sin egen grådige planlægger. Løsninger tager op til 6 minutter. Lukker browseren
    # forbindelsen, lukker nginx også sin til løseren, som så stopper søgningen.
    location = /api/solve {
        include /etc/nginx/snippets/security-headers.conf;
        if ($planner_fremmed_origin) { return 403; }
        limit_req zone=planner_solve burst=4 nodelay;
        limit_req zone=planner_solve_ip burst=20 nodelay;
        limit_req_status 429;
        error_page 429 = @planner_for_mange_kald;
        client_max_body_size 5m;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $planner_solver http://planner-solver:8000;
        proxy_pass $planner_solver/solve;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $planner_klient; # løseren fører regnskab med regnetid pr. klient
        proxy_read_timeout 420s;
        proxy_send_timeout 30s;
    }

    # Status for et job: klienten spørger hvert 3. sekund, mens løseren regner. Korte kald, så
    # Cloudflare (der afbryder kald efter ca. 100 s) ikke står i vejen for lange kørsler.
    location = /api/solve/status {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=planner_status burst=30 nodelay;
        limit_req zone=planner_status_ip burst=200 nodelay;
        limit_req_status 429;
        error_page 429 = @planner_for_mange_kald;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $planner_solver http://planner-solver:8000;
        proxy_pass $planner_solver/status$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    # "Stop og brug det bedste": beder løseren afslutte et igangværende job (job-id fra klienten)
    location = /api/solve/stop {
        include /etc/nginx/snippets/security-headers.conf;
        if ($planner_fremmed_origin) { return 403; }
        limit_req zone=planner_solve burst=10 nodelay;
        limit_req zone=planner_solve_ip burst=40 nodelay;
        limit_req_status 429;
        error_page 429 = @planner_for_mange_kald;
        client_max_body_size 2k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $planner_solver http://planner-solver:8000;
        proxy_pass $planner_solver/stop;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    # Rate-grænsen er nået: et svar, klienten kan forstå (før: 503 med en HTML-side). "graense" skelner det
    # fra løserens eget 429 ("løseren er optaget"), som kommer uændret igennem fra proxy_pass.
    location @planner_for_mange_kald {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/json;
        add_header Retry-After 10 always;
        add_header Cache-Control "no-store" always;
        return 429 '{"fejl":"for mange kald","graense":true}';
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/planner-csp.conf;
        try_files $uri $uri/ /index.html;
    }

    location ~* .html$ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/planner-csp.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location ~* .(png|jpg|jpeg|gif|ico|svg|webp|woff2)$ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/planner-csp.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* .css$ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/planner-csp.conf;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* .js$ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/planner-csp.conf;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}

# ── Prøvebillede — provebillede.dk ─────────────────────────
# Statisk side: det danske prøvebillede (PM5544) som SVG.
# Kun https://provebillede.dk/ må svare med siden — www, /index.html og
# ukendte stier gav før samme side med 200, som Google så registrerede som
# "alternative sider". Nu: 301 til den kanoniske adresse, ellers 404.
server {
    listen 80;
    server_name www.provebillede.dk;
    return 301 https://provebillede.dk$request_uri;
}

server {
    listen 80;
    server_name provebillede.dk;
    root /usr/share/nginx/provebillede;
    index index.html;

    # $request_uri (ikke location) så index-direktivets interne omdirigering
    # fra / til /index.html ikke rammer og giver en løkke
    if ($request_uri ~ ^/index\.html(\?.*)?$) {
        return 301 https://provebillede.dk/;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ =404;
    }

    location ~* \.html$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.css$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.js$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}

# ── Super Admin — admin.badmintonapp.dk + admin.footballapp.dk ──
# Samme UI for begge domæner — super admin håndterer både badminton- og football-klubber
server {
    listen 80;
    server_name admin.badmintonapp.dk admin.footballapp.dk;
    root /usr/share/nginx/html;

    client_max_body_size 50M;

    # Super-admin indlejres aldrig — bloker framing helt (clickjacking-værn)
    add_header X-Frame-Options "DENY" always;

    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Frame-Options "DENY" always;
        return 302 /super-admin.html;
    }

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Frame-Options "DENY" always;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location ^~ /uploads/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Frame-Options "DENY" always;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~* \.html$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location ~* \.js$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Frame-Options "DENY" always;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
}

# ── Football Marketing — footballapp.dk + www.footballapp.dk ──
# Statisk landing-side (samme mønster som badmintonapp.dk's marketing).
# Klub-subdomæner (lyngby.footballapp.dk osv.) håndteres af det næste block.
server {
    listen 80;
    server_name www.footballapp.dk;
    return 301 https://footballapp.dk$request_uri;
}

server {
    listen 80;
    server_name footballapp.dk;
    root /usr/share/nginx/football-marketing;
    index index.html;

    # Kun https://footballapp.dk/ svarer med siden — se badmintonapp.dk
    if ($request_uri ~ ^/index\.html(\?.*)?$) {
        return 301 https://footballapp.dk/;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ =404;
    }

    location ~* \.html$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.css$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.js$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}

# ── Football Klub-subdomæner — <klub>.footballapp.dk ──
# Tenant middleware i football-backend udleder klub fra Host-headeren.
# Subdomæne `admin` håndteres af det dedikerede super-admin block ovenfor.
server {
    listen 80;
    server_name ~^(?<club>[a-z0-9-]+)\.footballapp\.dk$;

    client_max_body_size 5M;

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $football_frontend http://football-frontend:80;
        proxy_pass $football_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Login: begrænset antal forsøg pr. klient, så adgangskoder ikke kan gættes uhindret
    location = /api/auth/login {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=football_login burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @football_for_mange_login;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $football_frontend http://football-frontend:80;
        proxy_pass $football_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Login-siden viser "error" fra svaret
    location @football_for_mange_login {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/json;
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
        return 429 '{"error":"For mange login-forsøg. Prøv igen om et minut."}';
    }
}

# ── App — app.badmintonapp.dk og alt andet ──────────────────
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow larger file uploads (for sponsor images)
    client_max_body_size 50M;

    # Device token entry links — proxyes til backend.
    # Sikkerheds-headere sættes af backendens helmet, så vi undlader snippet'et
    # her (ellers ville fx nosniff stå to gange på svaret).
    location /t/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy API requests to backend (helmet sætter selv sikkerheds-headerne)
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Proxy uploads to backend (^~ gives priority over regex locations).
    # Backendens helmet sætter nosniff m.m. på /uploads-svarene.
    location ^~ /uploads/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Tablet-appen (Android APK) + manifest med version — hentes fra
    # Indstillinger på en tablet. ^~ så regex-locations ikke fanger stien.
    # nginx' mime.types kender ikke .apk; uden den rigtige type nægter Chrome
    # på Android at tilbyde installation. no-cache: filnavnet er fast, så en
    # ny version må ikke hænge i en cache. Content-Disposition med filnavn
    # så downloaden hedder BadmintonApp.apk og ikke får et tilfældigt navn.
    location ^~ /downloads/ {
        include /etc/nginx/snippets/security-headers.conf;
        types {
            application/vnd.android.package-archive apk;
            application/json json;
        }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /downloads/BadmintonApp.apk {
        include /etc/nginx/snippets/security-headers.conf;
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "no-cache";
        add_header Content-Disposition 'attachment; filename="BadmintonApp.apk"';
        try_files $uri =404;
    }

    # HTML: revalidér altid (no-cache), så nye ?v=-referencer til CSS/JS
    # opdages med det samme i stedet for at hænge på en heuristisk cachet side.
    # try_files bevarer SPA-fallbacket for ukendte stier.
    location ~* \.html$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # Disable cache for JS files to ensure updates are loaded
    location ~* \.js$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Cache only images
    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Minimal cache for CSS
    location ~* \.css$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Frontend routes
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
