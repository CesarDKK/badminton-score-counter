# Content-Security-Policy for planner.badmintonapp.dk — inkluderes i hver location (se forklaringen i
# nginx-security-headers.conf om, hvorfor headere sættes pr. location).
#
# Planneren er rent statisk og henter intet udefra: scripts, skrifter og stylesheets ligger på samme
# origin, og det eneste netværkskald er /api/solve. Politikken er et ekstra værn oven på, at alt, der
# vises, bliver escapet (ui/dom.js: esc) og projektfiler valideres (store.js: validerProjekt):
# skulle noget alligevel slippe igennem, kan det hverken køre script eller sende data ud af huset.
#
#   script-src 'self'            ingen inline-scripts og ingen eval (tp-bundle.js bruger ingen af delene)
#   style-src  'unsafe-inline'   brugerfladen sætter style-attributter (bredder, farver) i den tegnede HTML
#   img-src    data:             favicon er en data:-URL
#   connect-src 'self'           kun /api/solve (fetch og sendBeacon)
#   frame-ancestors 'none'       planneren skal ikke kunne indlejres på andre sider (clickjacking)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
