# Tests ved hvert push og pull request.
#
# unit:        de rene unit-tests (ingen database, intet netværk).
# integration: backenden mod en rigtig MySQL 8.4 (nr. 56) — de gamle
#              integrationstest (backend/tests/0*.test.js) og skema, klub-isolation
#              og backup → gendan (backend/tests/integration/). Alle hemmeligheder
#              er opdigtede. Samme kørsel lokalt i Docker, fra repoets rod:
#                docker compose -f backend/tests/integration/compose.yml up --force-recreate --renew-anon-volumes --abort-on-container-exit --exit-code-from tests --attach tests
name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit-tests (backend + statistik + football + planner)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22   # samme major som containerne (node:22-alpine)

      - name: Backend — installer afhængigheder
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Backend — unit-tests
        working-directory: backend
        run: npm run test:unit

      - name: Statistik — installer afhængigheder
        working-directory: stats/backend
        run: npm ci --no-audit --no-fund

      - name: Statistik — unit-tests
        working-directory: stats/backend
        run: npm run test:unit

      - name: Football — installer afhængigheder
        working-directory: football-app/backend
        run: npm ci --no-audit --no-fund

      - name: Football — unit-tests
        working-directory: football-app/backend
        run: npm run test:unit

      - name: Planner — installer afhængigheder
        working-directory: planner
        run: npm ci --no-audit --no-fund

      # TP-testfilerne ligger ikke i repoet (persondata) — de tests springes over.
      - name: Planner — unit-tests
        working-directory: planner
        run: npm run test:unit

      # CP-SAT-løseren (Python + OR-Tools) bag planner.badmintonapp.dk/api/solve
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Planner-løser — installer afhængigheder
        working-directory: planner/solver
        run: pip install --no-cache-dir -r requirements.txt

      - name: Planner-løser — unit-tests
        working-directory: planner/solver
        run: python -m unittest -v test_solver.py

      # Kontrakt JS ↔ Python: rigtige problemer fra bygProblem() løses af CP-SAT, og svaret skal have
      # 0 fejl i tjekPlan(). Fanger, at de to sider glider fra hinanden (omdøbt felt, forskellig regel).
      - name: Planner — kontrakt (byg problemer i JS)
        working-directory: planner
        run: node tests/kontrakt/kontrakt.mjs byg tests/kontrakt/_ud

      - name: Planner — kontrakt (løs i Python)
        working-directory: planner/solver
        run: python kontrakt.py ../tests/kontrakt/_ud

      - name: Planner — kontrakt (tjek svarene i JS)
        working-directory: planner
        run: node tests/kontrakt/kontrakt.mjs tjek tests/kontrakt/_ud

      # nginx-konfigurationen afprøves, før den når serveren: en slåfejl her tager ALLE sites ned ved deploy.
      # Upstream-navnene findes kun i docker-netværket, så de peges på localhost under testen.
      # Hvert snippet, Dockerfile.frontend kopierer til /etc/nginx/snippets/, skal også monteres her.
      - name: nginx — konfigurationen er gyldig (nginx -t)
        run: |
          docker run --rm \
            --add-host backend:127.0.0.1 --add-host football-frontend:127.0.0.1 --add-host stats-backend:127.0.0.1 \
            -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/nginx-security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro" \
            -v "$PWD/nginx-planner-csp.conf:/etc/nginx/snippets/planner-csp.conf:ro" \
            -v "$PWD/nginx-statiske-sider-csp.conf:/etc/nginx/snippets/statiske-sider-csp.conf:ro" \
            nginx:alpine nginx -t

  integration:
    name: Integrationstest (backend + MySQL 8.4)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rod-opdigtet   # kun til testen — ingen rigtig hemmelighed
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -prod-opdigtet"
          --health-interval 2s --health-timeout 3s --health-retries 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Backend — installer afhængigheder
        working-directory: backend
        run: npm ci --no-audit --no-fund

      # Bygger master + databaserne fra init-scripts, starter backenden og kører
      # testene (backend/tests/integration/koer.js venter selv på MySQL og /health)
      - name: Integrationstest mod MySQL
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          MYSQL_ROOT_PASSWORD: rod-opdigtet
        run: node tests/integration/koer.js
