# Unit-tests ved hvert push og pull request.
#
# Kører KUN de rene unit-tests (ingen database, intet netværk) — de tager under
# et sekund. Integrationstestene i backend/tests/*.test.js kræver en kørende
# server og køres stadig manuelt efter deploy.
name: Tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit-tests (backend + statistik + planner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # samme major som containerne (node:22-alpine)

      - name: Backend — installer afhængigheder
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Backend — unit-tests
        working-directory: backend
        run: npm run test:unit

      - name: Statistik — installer afhængigheder
        working-directory: stats/backend
        run: npm ci --no-audit --no-fund

      - name: Statistik — unit-tests
        working-directory: stats/backend
        run: npm run test:unit

      - name: Planner — installer afhængigheder
        working-directory: planner
        run: npm ci --no-audit --no-fund

      # TP-testfilerne ligger ikke i repoet (persondata) — de tests springes over.
      - name: Planner — unit-tests
        working-directory: planner
        run: npm run test:unit

      # CP-SAT-løseren (Python + OR-Tools) bag planner.badmintonapp.dk/api/solve
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Planner-løser — installer afhængigheder
        working-directory: planner/solver
        run: pip install --no-cache-dir -r requirements.txt

      - name: Planner-løser — unit-tests
        working-directory: planner/solver
        run: python -m unittest -v test_solver.py

      # Kontrakt JS ↔ Python: rigtige problemer fra bygProblem() løses af CP-SAT, og svaret skal have
      # 0 fejl i tjekPlan(). Fanger, at de to sider glider fra hinanden (omdøbt felt, forskellig regel).
      - name: Planner — kontrakt (byg problemer i JS)
        working-directory: planner
        run: node tests/kontrakt/kontrakt.mjs byg tests/kontrakt/_ud

      - name: Planner — kontrakt (løs i Python)
        working-directory: planner/solver
        run: python kontrakt.py ../tests/kontrakt/_ud

      - name: Planner — kontrakt (tjek svarene i JS)
        working-directory: planner
        run: node tests/kontrakt/kontrakt.mjs tjek tests/kontrakt/_ud

      # nginx-konfigurationen afprøves, før den når serveren: en slåfejl her tager ALLE sites ned ved deploy.
      # Upstream-navnene findes kun i docker-netværket, så de peges på localhost under testen.
      - name: nginx — konfigurationen er gyldig (nginx -t)
        run: |
          docker run --rm \
            --add-host backend:127.0.0.1 --add-host football-frontend:127.0.0.1 --add-host stats-backend:127.0.0.1 \
            -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/nginx-security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro" \
            -v "$PWD/nginx-planner-csp.conf:/etc/nginx/snippets/planner-csp.conf:ro" \
            nginx:alpine nginx -t
