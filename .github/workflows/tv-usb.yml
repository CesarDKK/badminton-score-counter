# Bygger Badminton TV (kiosk/): USB-nøglen til PC'er og SD-kort-billedet til
# Raspberry Pi 3/4/5.
#
# - Push der rører kiosk/: test konfigurationslæseren og scriptene, og byg
#   begge billeder. Resultatet ligger som artefakter i 7 dage, så en branch kan
#   prøves på rigtig hardware uden at lave en release.
# - Tag tv-usb-v<version> (fx tv-usb-v2026.10.1): byg begge og læg dem ud som
#   én GitHub-release, som klubberne kan hente.
#
# Stifiltre gælder ikke for tags, så et tag bygger altid.
name: TV-USB

on:
  push:
    # branches skal stå her: med kun et tags-filter kører GitHub workflowet
    # udelukkende ved tags og aldrig ved almindelige push.
    branches:
      - '**'
    paths:
      - 'kiosk/**'
      - '.github/workflows/tv-usb.yml'
    tags:
      - 'tv-usb-v*'
  workflow_dispatch:

jobs:
  test:
    name: Test af scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Læsning af kiosk.conf
        run: bash kiosk/test/test-conf.sh

      - name: Netværksstatus (forkert kode, netværk ikke synligt …)
        run: bash kiosk/test/test-netstatus.sh

      - name: Automatisk opdatering (beslutning, manifest, signatur)
        run: bash kiosk/test/test-opdatering.sh

      - name: Browser-vagt (mod headless Chromium)
        run: docker run --rm -v "$PWD/kiosk:/src" debian:trixie bash /src/test/test-browservagt.sh

      - name: ShellCheck
        env:
          LANG: C.UTF-8   # filerne indeholder æøå
        run: |
          cd kiosk
          shellcheck -S warning -x \
            build.sh test/vm.sh test/test-conf.sh test/test-netstatus.sh test/test-browservagt.sh \
            test/test-opdatering.sh test/opdatering-vm.sh \
            pi/build-pi.sh pi/tilpas.sh pi/test-billede.sh \
            live/auto/config \
            live/config/hooks/normal/*.hook.chroot \
            live/config/includes.chroot_after_packages/usr/lib/badminton-tv/{conf.sh,rod.sh,setup,browser,cec,sluk,installer,netstatus,diagnose,hentlog,opdatering} \
            live/config/includes.chroot_after_packages/usr/lib/systemd/system-generators/badminton-tv-sluk-generator

  byg:
    name: Byg USB-billede (PC)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # live-build fylder 8-10 GB undervejs. Runnerens forudinstallerede SDK'er
      # fylder det dobbelte og skal ikke bruges her.
      - name: Frigør diskplads
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/tv-usb-v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#tv-usb-v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Byg
        run: |
          mkdir -p ud
          docker run --rm --privileged -e VERSION \
            -v "$PWD/kiosk:/src" -v "$PWD/ud:/ud" \
            debian:trixie bash /src/build.sh

      # Også ved tags: release-jobbet henter filerne herfra.
      - name: Gem som artefakt
        uses: actions/upload-artifact@v5
        with:
          name: tv-pc
          path: |
            ud/*.zip
            ud/*.img
            ud/*.squashfs
            ud/SHA256SUMS
          retention-days: 7
          compression-level: 0

  byg-pi:
    name: Byg SD-kort-billede (Raspberry Pi)
    needs: test
    # ARM-runner: Raspberry Pi OS' programmer kører uden emulering i chroot.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/tv-usb-v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#tv-usb-v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Byg
        run: |
          mkdir -p ud
          docker run --rm --privileged -e VERSION \
            -v "$PWD/kiosk:/src" -v "$PWD/ud:/ud" \
            debian:trixie bash /src/pi/build-pi.sh

      # En Pi kan ikke emuleres — så tjek billedets indhold, og kør setup og
      # slukke-generatoren inde i det.
      - name: Tjek billedet
        run: |
          docker run --rm --privileged \
            -v "$PWD/kiosk:/src" -v "$PWD/ud:/ud" \
            debian:trixie bash /src/pi/test-billede.sh "/ud/badminton-tv-pi-$VERSION.img.xz"

      - name: Gem som artefakt
        uses: actions/upload-artifact@v5
        with:
          name: tv-pi
          path: |
            ud/*.img.xz
            ud/SHA256SUMS-pi
          retention-days: 7
          compression-level: 0

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/tv-usb-v')
    needs: [byg, byg-pi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Kun den offentlige nøgle, så signaturen kan tjekkes, før den udgives
      - uses: actions/checkout@v5
        with:
          sparse-checkout: kiosk/live/config/includes.chroot_after_packages/usr/share/badminton-tv
          path: kilde

      - uses: actions/download-artifact@v5
        with:
          path: ud
          merge-multiple: true

      # PC'ernes automatiske opdatering henter releases/latest/download/opdatering.json
      # og tjekker signaturen med opdatering.pub fra billedet. vent_timer: så
      # længe venter PC'er med OPDATERING=auto efter udgivelsen — PC'er med
      # OPDATERING=foerst henter med det samme. Den private nøgle ligger som
      # secret TV_OPDATERING_NOEGLE (PEM, ed25519); uden den udgives intet.
      - name: Opdateringsmanifest (signeret)
        env:
          NOEGLE: ${{ secrets.TV_OPDATERING_NOEGLE }}
        run: |
          if [ -z "$NOEGLE" ]; then
            echo "::error::Secret TV_OPDATERING_NOEGLE mangler — se kiosk/README.md (Udgivelser)"
            exit 1
          fi
          VERSION=${GITHUB_REF_NAME#tv-usb-v}
          ROD=badminton-tv-rod-$VERSION.squashfs
          cd ud
          jq -n --arg version "$VERSION" --arg fil "$ROD" \
                --arg sha256 "$(sha256sum "$ROD" | cut -d' ' -f1)" \
                --argjson bytes "$(stat -c %s "$ROD")" \
                --argjson udgivet "$(date +%s)" \
                '{version: $version, udgivet: $udgivet, vent_timer: 24,
                  rod: {fil: $fil, sha256: $sha256, bytes: $bytes}}' > opdatering.json
          cat opdatering.json
          umask 077
          printf '%s\n' "$NOEGLE" > "$RUNNER_TEMP/noegle.pem"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/noegle.pem" -rawin \
            -in opdatering.json -out opdatering.json.sig
          rm -f "$RUNNER_TEMP/noegle.pem"
          openssl pkeyutl -verify -rawin -pubin \
            -inkey ../kilde/kiosk/live/config/includes.chroot_after_packages/usr/share/badminton-tv/opdatering.pub \
            -in opdatering.json -sigfile opdatering.json.sig

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#tv-usb-v}
          cd ud
          cat SHA256SUMS-pi >> SHA256SUMS
          rm SHA256SUMS-pi
          cat > ../noter.md <<EOF
          Laver en PC eller en Raspberry Pi om til en TV-skærm i hallen. Ret \`kiosk.conf\` og følg \`VEJLEDNING.txt\`.

          **PC (USB-nøgle)** — hent én af filerne:
          - \`badminton-tv-usb-$VERSION.zip\` — pak den ud på en FAT32-formateret USB-nøgle (8-32 GB).
          - \`badminton-tv-usb-$VERSION.img\` — skriv den med [balenaEtcher](https://etcher.balena.io/) eller Rufus. Virker med alle størrelser.

          ⚠️ Installationen sletter alt på PC'ens disk.

          **Allerede installerede PC'er** opdaterer sig selv: \`opdatering.json\` (signeret) og \`badminton-tv-rod-$VERSION.squashfs\` hentes automatisk. PC'er med \`OPDATERING=foerst\` henter med det samme, de øvrige efter 24 timer. Stop udrulningen ved at markere udgivelsen som pre-release.

          **Raspberry Pi 3, 4 og 5 (SD-kort):**
          - \`badminton-tv-pi-$VERSION.img.xz\` — skriv den til et SD-kort (mindst 8 GB) med [Raspberry Pi Imager](https://www.raspberrypi.com/software/) ("Use custom", uden OS-tilpasning) eller balenaEtcher. \`kiosk.conf\` ligger på kortet bagefter.
          EOF
          gh release create "$GITHUB_REF_NAME" * \
            --repo "$GITHUB_REPOSITORY" \
            --title "Badminton TV $VERSION" \
            --notes-file ../noter.md
