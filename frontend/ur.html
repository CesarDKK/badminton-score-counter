<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <!-- Apple Watch: vis siden i urets egen størrelse i stedet for at skalere en
         telefonside ned (disabled-adaptations) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="disabled-adaptations" content="watch">
    <meta name="theme-color" content="#0f0e17">
    <title>Tæl fra Apple Watch — BadmintonApp</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5">
    <style>
        :root {
            --bg: #0f0e17;
            --kort: #1d1b2e;
            --kant: rgba(255, 255, 255, 0.12);
            --tekst: #ffffff;
            --daempet: rgba(255, 255, 255, 0.62);
            --accent: #e94560;
            --vind: #45d17e;
            --advarsel: #ffb02e;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; background: var(--bg); color: var(--tekst); }
        /* Urets adresselinje (✕, klokken og adressen) tager næsten halvdelen af
           skærmen og kan ikke rulles væk — den kommer tilbage, når rulningen
           stopper. Siden passer derfor i området under den (100dvh), og alt er
           lavet kompakt til det: spillerne side om side, tastatur i 3 rækker, ingen
           overskrift på kodesiden. Knapperne har en mindstehøjde, så de aldrig
           klemmes sammen — er skærmen for lille, kan der rulles i stedet */
        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex; flex-direction: column;
            font-family: -apple-system, system-ui, sans-serif;
            padding: 2px 3px max(3px, env(safe-area-inset-bottom));
            user-select: none;
            -webkit-user-select: none;
        }
        button { font: inherit; color: inherit; border: 0; cursor: pointer; }
        .skjult { display: none !important; }
        .side { display: flex; flex-direction: column; gap: 3px; flex: 1 0 auto; }
        .side > * { flex-shrink: 0; }
        .lille { font-size: 11px; color: var(--daempet); text-align: center; line-height: 1.25; }

        /* Koden: tastaturet (4 × 3) fylder resten af skærmen */
        #kodeVisning { font-size: 20px; letter-spacing: 0.12em; text-align: center; line-height: 1.15; font-variant-numeric: tabular-nums; }
        #kodeTekst.fejl { color: var(--advarsel); }
        .side > .tastatur { flex: 1 0 auto; }
        .tastatur { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: minmax(26px, 1fr); gap: 3px; }
        .tastatur button { background: var(--kort); border-radius: 8px; padding: 0; font-size: 17px; }
        .tastatur .ok { background: var(--accent); font-size: 14px; font-weight: 700; }

        /* Tællingen: to høje knapper side om side (lettere at ramme end to tynde
           striber), spillerne står fast hele kampen. Kun navn og point —
           sættene står på TV'et */
        .side > .spillere, .side > .stor { flex: 1 0 0; min-height: 34px; }
        .spillere { display: flex; gap: 3px; min-height: 60px; }
        .spiller {
            flex: 1 1 0; min-width: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
            background: var(--kort);
            border: 2px solid var(--kant);
            border-radius: 12px;
            padding: 4px;
            overflow: hidden;
            text-align: center;
        }
        .spiller:active { background: #2a2740; }
        .spiller[disabled] { opacity: 0.45; }
        .spiller.serv { border-color: var(--accent); }
        .spiller .navn {
            width: 100%; font-size: 12px; line-height: 1.15; word-break: break-word;
            overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        }
        .spiller .point { font-size: 40px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
        .spiller.vinder { border-color: var(--vind); }
        .raekke { display: flex; gap: 3px; }
        .raekke button { flex: 1; background: var(--kort); border-radius: 10px; padding: 5px 0; font-size: 13px; }
        .raekke .primaer { background: var(--accent); font-weight: 700; }
        #status:empty { display: none; }
        #status.venter { color: var(--daempet); }
        #status.fejl { color: var(--advarsel); }

        /* Pausen og kampslut: stillingen står på TV'et, så uret viser kun det,
           der skal trykkes på — store knapper, der fylder skærmen */
        .stor {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
            background: var(--kort);
            border: 2px solid var(--kant);
            border-radius: 12px;
            font-size: 18px; font-weight: 700;
        }
        .stor:active { background: #2a2740; }
        .stor.primaer { background: var(--accent); border-color: var(--accent); }
        .stor.primaer:active { filter: brightness(0.9); }
        .stor .tid { font-size: 12px; font-weight: 400; font-variant-numeric: tabular-nums; }
        #kampSide.i-pause .spillere, #kampSide.slut .spillere { display: none; }
        /* Tryk, der ikke er nået frem: pointtallene står nedtonet, til serveren har svaret */
        #kampSide.venter .spiller .point { opacity: 0.45; }
        /* De store knapper er spærret et øjeblik, når de kommer frem (ur-script.js
           SKIFT_SPAERRING_MS) — de toner ind, så det kan ses, at de ikke er klar endnu */
        #kampSide.i-pause .stor, #kampSide.slut .stor { animation: knapKlar 0.8s ease-out both; }
        @keyframes knapKlar { from { opacity: 0.25; } 60% { opacity: 0.25; } to { opacity: 1; } }
        /* Kampslut: Fortryd er lige så stor som "Ny kamp" og "Færdig" */
        #kampSide.slut .raekke { flex: 1 0 0; min-height: 34px; }
        #kampSide.slut .raekke button { border: 2px solid var(--kant); border-radius: 12px; font-size: 18px; font-weight: 700; }
    </style>
</head>
<body>
    <!-- 1. Banens kode fra TV'et -->
    <div id="kodeSide" class="side skjult">
        <div id="kodeTekst" class="lille">Tast koden fra banens TV</div>
        <div id="kodeVisning"></div>
        <div class="tastatur" id="tastatur"></div>
    </div>

    <!-- 2. Kampen -->
    <div id="kampSide" class="side skjult">
        <div class="lille" id="overskrift"></div>
        <div class="spillere">
            <button class="spiller" id="side0"><span class="navn"></span><span class="point"></span></button>
            <button class="spiller" id="side1"><span class="navn"></span><span class="point"></span></button>
        </div>
        <!-- Pausen ved 11 (8) og mellem sæt: kun "Fortsæt" med nedtællingen -->
        <button id="naeste" class="stor primaer skjult"><span>Fortsæt</span><span class="tid"></span></button>
        <!-- Kampen er slut: spil videre, eller log uret ud -->
        <button id="nyKamp" class="stor primaer skjult">Ny kamp</button>
        <button id="faerdig" class="stor skjult">Færdig</button>
        <div class="raekke">
            <button id="fortryd">↶ Fortryd</button>
            <!-- Serveren er valgt: kampen begynder (TV'et skifter til kampen) -->
            <button id="startKamp" class="primaer skjult">Start kamp</button>
            <button id="overtag" class="primaer skjult">Overtag</button>
            <button id="faerdigLille" class="skjult">Færdig</button>
        </div>
        <div id="status" class="lille"></div>
    </div>

    <script src="js/taeller-regler.js?v=4"></script>
    <script src="ur-script.js?v=12"></script>
</body>
</html>
