<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bane TV Visning - V3</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5">
    <link rel="icon" type="image/png" href="/favicon.png?v=5">
    <link rel="stylesheet" href="fonts.css?v=2">
    <link rel="stylesheet" href="fundament.css?v=2">
    <link rel="stylesheet" href="tv-v3-styles.css?v=20">
    <script src="js/theme-loader.js?v=15"></script>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="tv-container">
        <!-- Header with court number and timer -->
        <div class="tv-header">
            <h1>BANE <span id="courtNumber">1</span></h1>
            <!-- badmintonplanner.dk: rundenavn + næste runde (skjult uden runde) -->
            <div class="tv-planner-head" id="tvPlannerHead" style="display:none;">
                <span class="tv-planner-label" id="tvPlannerLabel"></span>
                <span class="tv-planner-next" id="tvPlannerNext"></span>
            </div>
            <!-- "2. SÆT · 14:32" (afgjort: "AFGJORT · 52:40", pause: "PAUSE · 3. SÆT NÆSTE") -->
            <div class="timer-display"><span class="tv-live-maerke" aria-hidden="true"><span class="tv-live-prik"></span>LIVE</span><span class="tv-set-label" id="tvSetLabel"></span><span id="timerDisplay">00:00</span></div>
            <!-- Pause: hvor meget af pausen der er gået -->
            <span class="tv-pause-fremdrift" id="tvPauseFremdrift" aria-hidden="true"></span>
        </div>

        <!-- Main scoreboard -->
        <div class="scoreboard">
            <!-- Team 1 -->
            <div class="team-row" id="team1Row">
                <img class="tv-team-logo" id="team1Logo" alt="" style="display:none;" onerror="this.style.display='none'">
                <div class="team-names">
                    <div class="tv-player-row"><img class="tv-player-logo" id="player1Logo" alt="" style="display:none;" onerror="this.style.display='none'"><div class="player-name" id="player1Name">Spiller 1</div></div>
                    <div class="tv-player-row"><img class="tv-player-logo" id="player1Logo2" alt="" style="display:none;" onerror="this.style.display='none'"><div class="player-name partner-name" id="player1Name2" style="display: none;">Makker 1</div></div>
                </div>
                <!-- Afsluttede sæt (små) — når kampen er afgjort: alle sæt i stor størrelse -->
                <div class="set-boxes">
                    <div class="set-box tom" id="team1Set1"></div>
                    <div class="set-box tom" id="team1Set2"></div>
                    <div class="set-box tom" id="team1Set3"></div>
                </div>
                <!-- Point i det sæt, der spilles nu -->
                <div class="team-score" id="team1Score">0</div>
            </div>

            <!-- badmintonplanner.dk, før der tælles: "MOD" mellem holdene (se .planner-navne) -->
            <div class="tv-planner-mod" aria-hidden="true">MOD</div>

            <!-- Team 2 -->
            <div class="team-row" id="team2Row">
                <img class="tv-team-logo" id="team2Logo" alt="" style="display:none;" onerror="this.style.display='none'">
                <div class="team-names">
                    <div class="tv-player-row"><img class="tv-player-logo" id="player2Logo" alt="" style="display:none;" onerror="this.style.display='none'"><div class="player-name" id="player2Name">Spiller 2</div></div>
                    <div class="tv-player-row"><img class="tv-player-logo" id="player2Logo2" alt="" style="display:none;" onerror="this.style.display='none'"><div class="player-name partner-name" id="player2Name2" style="display: none;">Makker 2</div></div>
                </div>
                <div class="set-boxes">
                    <div class="set-box tom" id="team2Set1"></div>
                    <div class="set-box tom" id="team2Set2"></div>
                    <div class="set-box tom" id="team2Set3"></div>
                </div>
                <div class="team-score" id="team2Score">0</div>
            </div>
            <!-- Pause (layout A): rækkerne med navne og sæt bliver stående, og
                 nedtællingen erstatter pointfeltet i begge rækker -->
            <div class="tv-pause-panel" id="tvPausePanel" aria-live="off">
                <span class="tv-pause-titel">PAUSE</span>
                <span class="tv-pause-tal" id="tvPauseTal">0:00</span>
                <span class="tv-pause-af" id="tvPauseAf"></span>
            </div>
        </div>

        <!-- Bundbjælke: udskiftere/banenote (badmintonplanner.dk) til venstre,
             bane-sponsorbanner i midten. QR-koden (#qrCounter) ligger fast i
             højre side, og bjælken holder plads til den. -->
        <div class="tv-footer">
            <div class="tv-planner-strip" id="tvPlannerStrip" style="display:none;">
                <div class="tv-planner-subs" id="tvPlannerSubs" style="display:none;">
                    <span class="tv-planner-strip-label">Udskiftere</span>
                    <span class="tv-planner-subs-names" id="tvPlannerSubsNames"></span>
                </div>
                <div class="tv-planner-note" id="tvPlannerCourtNote" style="display:none;"></div>
            </div>
            <div class="tv-footer-banner" id="tvFooterBanner"></div>
        </div>
    </div>

    <!-- QR Counter — kun synlig i klub-mode når banen er ledig. Vises ovenpå slideshow. -->
    <div id="qrCounter" class="qr-counter" style="display: none;">
        <div class="qr-counter__label">TÆL MED DIN TELEFON</div>
        <img id="qrCounterImage" class="qr-counter__image" alt="Scan med telefon for at tælle kampen">
    </div>

    <!-- Livestream: rød ramme om skærmen, mens banens TV-PC sender kameraet (body.tv-live).
         Uden header (sponsorskærm mellem kampene) hænger LIVE-fanen i rammens hjørne. -->
    <div class="tv-live-ramme" aria-hidden="true"></div>
    <div class="tv-live-fane" aria-hidden="true"><span class="tv-live-prik"></span>LIVE</div>

    <!-- Afgjort kamp vises direkte på tavlen (.tv-container.afgjort) — intet overlay -->

    <script src="js/api.js?v=38"></script>
    <script src="js/adgangslink-vagt.js?v=1"></script>
    <script src="js/auth-guard.js?v=3"></script>
    <script src="js/logo-match.js?v=2"></script>
    <script src="js/live-updates.js?v=2"></script>
    <script src="js/name-display.js?v=2"></script>
    <script src="tv-script-v3.js?v=61"></script>
</body>
</html>
