# Hardware-vagthund: systemd nulstiller chipsættets vagthund-ur (Intel TCO på
# PC'en, bcm2835 på Raspberry Pi) med få sekunders mellemrum. Fryser PC'en,
# så det ikke sker længere, genstarter hardwaren den efter 15 sekunder — i
# stedet for at skærmen står frosset, til nogen holder tænd/sluk-knappen inde.
# 15 s er det højeste, Pi'ens vagthund kan.
[Manager]
RuntimeWatchdogSec=15s
# Hænger en nedlukning eller genstart, gennemtvinges den efter 2 minutter
RebootWatchdogSec=2min
