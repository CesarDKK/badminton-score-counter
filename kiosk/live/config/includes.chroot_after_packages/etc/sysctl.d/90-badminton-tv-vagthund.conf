# Et TV skal hellere genstarte end stå frosset:
# - kernepanik: genstart efter 10 sekunder (ellers står den for evigt)
# - en CPU der hænger i kernen (soft/hard lockup): behandles som panik
# Kernebeskeden fra panikken gemmes i pstore og kommer med i "Hent fejllog".
kernel.panic = 10
kernel.softlockup_panic = 1
kernel.hardlockup_panic = 1

# Processer, der hænger på disken: set på en M70q (2026-10-06), hvor disken
# holdt op med at svare. Kernen kørte videre (hardware-vagthunden blev fodret),
# men intet kunne skrives, og PC'en stod med et frosset billede hele natten.
# Har en proces ventet på I/O i 2 minutter uden at komme videre, behandles det
# som en panik: årsagen (diskfejlene) gemmes i pstore, og PC'en genstarter.
kernel.hung_task_timeout_secs = 120
kernel.hung_task_panic = 1
