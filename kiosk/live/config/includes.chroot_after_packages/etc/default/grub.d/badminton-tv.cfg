# Direkte ind i TV-visningen: ingen menu, ingen tekst, ingen skærmslukning.
GRUB_TIMEOUT=0
GRUB_TIMEOUT_STYLE=hidden
GRUB_DISTRIBUTOR="Badminton TV"
# nvme_core.default_ps_max_latency_us=0: NVMe-disken må ikke gå i dyb
# strømsparetilstand (APST). Kendt årsag til, at disken "forsvinder" under
# Linux, når PC'en står stille i timevis — som et TV gør.
GRUB_CMDLINE_LINUX_DEFAULT="quiet loglevel=3 consoleblank=0 vt.global_cursor_default=0 nvme_core.default_ps_max_latency_us=0"
GRUB_DISABLE_OS_PROBER=true
