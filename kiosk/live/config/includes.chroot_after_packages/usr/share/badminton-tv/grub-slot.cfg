# Badminton TV — opstartslinjen for dette system. Kaldes af vælgeren på
# EFI-partitionen (grub-esp.cfg), som har sat rod, slot (a/b) og forsoeg (1 =
# et nyt system på prøve). Ligger i systemet selv, så ændrede kerneparametre
# følger med en opdatering.
#
# nvme_core.default_ps_max_latency_us=0: NVMe-disken må ikke gå i dyb
# strømsparetilstand (APST). Kendt årsag til, at disken "forsvinder" under
# Linux, når PC'en står stille i timevis — som et TV gør.
#
# panic=10: går systemet i stå, før systemd og vagthunden kører (kernepanik,
# eller initramfs finder ikke roden), genstarter PC'en efter 10 sekunder i
# stedet for at vente for evigt. Var det en ny version på prøve, starter
# vælgeren så den forrige.
linux  (${rod})/vmlinuz root=LABEL=badminton-tv-${slot} ro quiet loglevel=3 consoleblank=0 vt.global_cursor_default=0 nvme_core.default_ps_max_latency_us=0 panic=10 badminton.slot=${slot} badminton.forsoeg=${forsoeg}
initrd (${rod})/initrd.img
boot
