# Badminton TV — vælger mellem system A og B på PC'ens disk.
#
# Installeren lægger filen på EFI-partitionen som \EFI\debian\grub.cfg, hvor
# Debians signerede GRUB leder efter sin konfiguration. Den ændres aldrig
# bagefter: kernen og dens parametre står i hvert system for sig
# (/usr/share/badminton-tv/grub-slot.cfg), så de følger med opdateringerne.
#
# badminton-tv.env (ved siden af denne fil, skrives med grub-editenv):
#   aktiv=a|b   systemet, der starter normalt
#   proev=a|b   start dette system én gang (sat af /usr/lib/badminton-tv/opdatering)
#
# proev slettes HER, før det nye system startes. Bekræfter det nye system ikke
# sig selv (badminton-tv-opdatering-bekraeft), starter næste opstart det gamle
# igen — uanset om det nye frøs, blev genstartet af vagthunden eller blev
# slukket på knappen.

set timeout=0
set timeout_style=hidden
set btenv="${prefix}/badminton-tv.env"

load_env --file "${btenv}" aktiv proev
if [ "${aktiv}" != "b" ]; then set aktiv="a"; fi

set slot="${aktiv}"
set forsoeg="0"
if [ "${proev}" = "a" ]; then set slot="a"; set forsoeg="1"; fi
if [ "${proev}" = "b" ]; then set slot="b"; set forsoeg="1"; fi
if [ "${forsoeg}" = "1" ]; then
    set proev=""
    save_env --file "${btenv}" proev
fi

if search --no-floppy --label --set=rod "badminton-tv-${slot}"; then
    source "(${rod})/usr/share/badminton-tv/grub-slot.cfg"
fi

# Hertil kommer vi kun, hvis det valgte system ikke kunne startes. Var det et
# nyt system på prøve, så start det aktive i stedet.
if [ "${slot}" != "${aktiv}" ]; then
    set slot="${aktiv}"
    set forsoeg="0"
    if search --no-floppy --label --set=rod "badminton-tv-${slot}"; then
        source "(${rod})/usr/share/badminton-tv/grub-slot.cfg"
    fi
fi
