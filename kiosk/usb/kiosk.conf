# ============================================================
#  BADMINTON TV — INDSTILLINGER
# ============================================================
#
#  Ret linjerne herunder, gem filen, og sæt USB-nøglen i PC'en.
#  Linjer der starter med # er kommentarer og bliver ignoreret.
#
# ------------------------------------------------------------

# Siden TV'et skal vise. SKAL udfyldes.
#
# Brug helst et adgangslink fra admin-siden (Adgangslinks → TV-skærm).
# Så kan bane og QR-kode skiftes fra admin-siden uden at røre PC'en.
#
#   Adgangslink:    https://lyngby.badmintonapp.dk/t/AbC123xyz
#   Bane 1 direkte: https://lyngby.badmintonapp.dk/tv-v3.html?id=1
#   Oversigt:       https://lyngby.badmintonapp.dk/oversigt.html
#
TV_URL=

# WiFi. Lad begge være tomme, hvis PC'en bruger netværkskabel.
WIFI_NAVN=
WIFI_KODE=

# PC'ens navn på netværket, fx tv-bane1. Kan udelades.
NAVN=badminton-tv

# Klokkeslæt hvor PC'en slukker af sig selv, hvis ingen har slukket den.
# Skriv "aldrig" for at slå det fra.
SLUK_KL=23:59

# ------------------------------------------------------------
#  Avanceret — behøver normalt ikke at blive ændret
# ------------------------------------------------------------

# Tænd/sluk TV'et via HDMI-CEC: auto eller fra.
# Virker kun, hvis PC'en og kablet understøtter det. Prøv det med
# "Test uden at installere" i startmenuen.
CEC=auto

# Størrelse på skærmen: auto eller et tal, fx 1.5
# auto skalerer op på 4K-TV'er.
SKALERING=auto

# Har PC'en mere end én disk, skal du skrive, hvilken der skal bruges,
# fx DISK=/dev/nvme0n1 — installationen fortæller, hvilke der findes.
DISK=
