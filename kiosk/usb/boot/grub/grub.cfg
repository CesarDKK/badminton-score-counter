# Startmenu på Badminton TV USB-nøglen.
#
# Menuteksterne er ASCII: GRUB's tekstkonsol kan ikke altid vise æøå.
# "Installer" er standard efter 10 sekunder — selve installationen viser
# derefter, hvad der slettes, og tæller 15 sekunder ned, før noget sker.

set default=installer
set timeout=10
set timeout_style=menu
terminal_output console

menuentry "Installer Badminton TV  (SLETTER PC'ens disk)" --id installer {
    linux  /live/vmlinuz boot=live toram quiet loglevel=3 nvme_core.default_ps_max_latency_us=0 badminton.tilstand=installer
    initrd /live/initrd.img
}

menuentry "Test uden at installere  (intet bliver slettet)" --id proeve {
    linux  /live/vmlinuz boot=live quiet loglevel=3 nvme_core.default_ps_max_latency_us=0 badminton.tilstand=proeve
    initrd /live/initrd.img
}

menuentry "Hent fejllog fra PC'en til USB-noeglen  (intet bliver slettet)" --id hentlog {
    linux  /live/vmlinuz boot=live toram quiet loglevel=3 nvme_core.default_ps_max_latency_us=0 badminton.tilstand=hentlog
    initrd /live/initrd.img
}

menuentry "BIOS-indstillinger" --id bios {
    fwsetup
}

menuentry "Sluk PC'en" --id sluk {
    halt
}
