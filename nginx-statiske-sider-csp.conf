# Content-Security-Policy + clickjacking-værn for de små statiske sider (provebillede.dk og cogj.dk) —
# inkluderes i hver location sammen med security-headers.conf (se forklaringen dér om, hvorfor headere
# sættes pr. location, og hvorfor X-Frame-Options IKKE ligger i det fælles snippet).
#
# Siderne er én HTML-fil hver uden brugerinput, og de henter intet udefra: skrifter, billeder og
# scripts ligger på samme origin. Politikken er et ekstra værn, ikke det eneste.
#
#   script-src 'unsafe-inline'   sidens eget script er inline — og det er Cloudflares bot-script, som
#                                Cloudflare indsætter før </body> i produktion (henter så sin egen
#                                /cdn-cgi/challenge-platform/... fra samme origin og POST'er dertil)
#   style-src  'unsafe-inline'   <style>-blokkene er inline
#   img-src    data: blob:       favicon er en data:-URL; provebillede.dk's PNG-eksport tegner SVG'en
#                                via en blob:-URL ind på et canvas
#   frame-ancestors 'none'       siderne skal ikke kunne indlejres på andre sider (clickjacking);
#                                X-Frame-Options er det samme for ældre browsere
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
